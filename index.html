<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROOT@CLAPPIPE:~#</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        body { font-family: 'Fira Code', monospace; text-shadow: 0 0 6px var(--glow-color, rgba(34, 197, 94, 0.7)); }
        .crt::after {
            content: " "; display: block; position: fixed; top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.35) 50%);
            z-index: 99999; pointer-events: none; background-size: 100% 5px;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        @keyframes shake {
            0%, 100% { transform: translate(0, 0); }
            10%, 30%, 50%, 70%, 90% { transform: translate(-5px, 3px); }
            20%, 40%, 60%, 80% { transform: translate(5px, -3px); }
        }
        .shake-active { animation: shake 0.4s ease-in-out; }
    </style>
</head>
<body class="bg-[#020503] text-green-400 min-h-screen flex items-center justify-center p-4 crt overflow-hidden relative select-none">

    <canvas id="matrix-canvas" class="absolute inset-0 w-full h-full opacity-[0.10] pointer-events-none z-0 transition-all duration-500"></canvas>

    <div id="boot-screen" class="absolute inset-0 bg-black z-50 flex flex-col justify-between p-12 text-xs font-mono tracking-wider overflow-hidden">
        <div id="boot-logs" class="space-y-1.5 text-green-500"></div>
        <div class="text-right text-green-800 font-bold animate-pulse">[ CLAPPIPE_CORE_READY ]</div>
    </div>

    <div id="main-terminal" class="w-full max-w-2xl bg-[#010402]/95 border-2 border-green-500/40 rounded-xl p-6 shadow-[0_0_50px_rgba(34,197,94,0.15)] relative z-10 backdrop-blur-sm transition-all duration-500 transform scale-95 opacity-0">
        
        <div id="alert-glow" class="absolute inset-0 bg-red-600/0 rounded-xl pointer-events-none transition-all duration-500 z-0"></div>

        <div class="relative z-10">
            <div id="title-bar" class="flex items-center justify-between border-b border-green-500/30 pb-3 mb-6 text-xs text-green-500/60 font-bold tracking-widest transition-colors duration-500">
                <div id="protocol-title">⚡ SYSTEM://CLAPPIPE_RAM_STREAM_v4.0</div>
                <div class="flex gap-1.5">
                    <span id="indicator-pulse" class="w-2.5 h-2.5 rounded-full bg-green-500 shadow-[0_0_8px_#22c55e] animate-pulse transition-all duration-500"></span>
                </div>
            </div>

            <div id="setup-section" class="space-y-6">
                <div class="border border-green-500/30 bg-black/60 p-5 rounded-lg shadow-inner">
                    <button id="generate-btn" class="w-full bg-green-950/20 hover:bg-green-500 hover:text-black text-green-400 border border-green-500 font-bold py-3 rounded tracking-widest transition-all cursor-pointer text-xs uppercase shadow-[0_0_15px_rgba(34,197,94,0.1)] active:scale-[0.99]">
                        [ FORGE CLAPPIPE GATEWAY ]
                    </button>
                    
                    <div id="generated-code-box" class="hidden mt-5 pt-4 border-t border-green-500/20 text-center">
                        <p class="text-[10px] text-green-500/50 tracking-widest">BROADCAST SIGNAL KEY:</p>
                        <div id="display-code" class="mt-2 text-4xl font-black text-white bg-green-950/40 py-3 border border-green-500/40 tracking-[0.5em] pl-[0.5em] rounded animate-pulse">----</div>
                    </div>
                </div>

                <div class="text-center text-[10px] text-green-500/30 font-bold tracking-[0.4em]">// STREAM INTERCEPT //</div>

                <div class="border border-green-500/30 bg-black/60 p-5 rounded-lg shadow-inner">
                    <label class="block text-[10px] font-mono text-green-500/50 tracking-widest uppercase mb-2">TARGET CLAP VECTOR PIN:</label>
                    <div class="flex gap-3">
                        <input type="text" id="room-code-input" maxlength="4" placeholder="0000" class="w-full bg-black border border-green-500/30 rounded px-4 py-3 text-center text-green-400 text-2xl font-mono font-bold tracking-[0.3em] focus:outline-none focus:border-green-500 placeholder-green-950">
                        <button id="join-btn" class="bg-green-500 hover:bg-green-400 text-black font-extrabold px-8 rounded tracking-widest transition-all cursor-pointer text-xs uppercase">INJECT</button>
                    </div>
                </div>
                <p id="status" class="text-xs text-center font-mono text-yellow-500 min-h-[16px] tracking-wide uppercase"></p>
            </div>

            <div id="sync-section" class="hidden space-y-5">
                <div id="link-banner" class="bg-green-950/20 border border-green-500/30 p-2.5 rounded text-xs text-green-400 flex items-center justify-between font-mono shadow-inner transition-colors duration-500">
                    <span id="banner-text" class="flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-green-500 shadow-[0_0_8px_#22c55e] animate-ping"></span> 
                        CLAPPIPE TUNNEL SECURED // NO footprint RELAY
                    </span>
                    <span class="font-bold">VECTOR: <span id="active-room-id" class="text-white bg-green-950 px-2 py-0.5 rounded border border-green-500/30">----</span></span>
                </div>

                <div>
                    <label class="block text-[10px] text-green-500/50 tracking-widest uppercase mb-1.5"># MEMORY_LOG_MIRROR</label>
                    <textarea id="clipboard-box" rows="4" placeholder="[CLAP_SHELL]:~ Type logs to sync..." class="w-full bg-black border border-green-500/30 rounded-lg p-4 text-green-400 text-sm focus:outline-none focus:border-green-500 transition-all resize-none font-mono placeholder-green-900/40 leading-relaxed shadow-inner"></textarea>
                </div>

                <div>
                    <label class="block text-[10px] text-green-500/50 tracking-widest uppercase mb-1.5"># BINARY_BEAM_PIPELINE</label>
                    <div class="relative border border-dashed border-green-500/30 hover:border-green-500/60 rounded-lg p-5 bg-black/40 text-center group cursor-pointer transition-colors duration-500" id="file-dropzone">
                        <input type="file" id="file-input" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10">
                        <p id="upload-placeholder" class="text-xs text-green-500/40 font-mono tracking-wider group-hover:text-green-400/70 uppercase">[ TRANSMIT DATA PAYLOAD OVER CLAPPIPE ]</p>
                    </div>
                    
                    <div id="purge-zone" class="hidden mt-3">
                        <button id="purge-btn" class="w-full bg-red-950/40 hover:bg-red-600 hover:text-black text-red-500 border border-red-500 font-bold py-2 rounded tracking-widest text-xs uppercase cursor-pointer shadow-[0_0_15px_rgba(239,68,68,0.2)] transition-all">
                            [ X ] EMERGENCY PURGE (WIPE PIPELINE)
                        </button>
                    </div>
                </div>

                <div>
                    <label class="block text-[10px] text-green-500/50 tracking-widest uppercase mb-1.5"># CLAPPIPE_CORE_LOGS</label>
                    <div id="terminal-logs" class="w-full h-24 bg-black border border-green-500/20 rounded-lg p-3 text-[10px] font-mono text-green-500/70 overflow-y-auto no-scrollbar space-y-1 shadow-inner select-text"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function speakAI(text) {
            try {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.rate = 1.0; utterance.pitch = 0.6;
                window.speechSynthesis.speak(utterance);
            } catch(e) {}
        }

        const bootScreen = document.getElementById('boot-screen');
        const mainTerminal = document.getElementById('main-terminal');
        const bootLogs = document.getElementById('boot-logs');
        const bootScripts = [
            "INITIALIZING CLAPPIPE PROTOCOLS...",
            "DECRYPTING PROXY GATEWAYS... [BYPASSED]",
            "TUNNEL MATRIX STABLE. OVERRIDING MEMORY LAYERS...",
            "SUCCESS: CLAPPIPE CORE ONLINE."
        ];

        let scriptIdx = 0;
        function runBootSequence() {
            if (scriptIdx < bootScripts.length) {
                const p = document.createElement('p');
                p.innerText = `>_ ${bootScripts[scriptIdx]}`;
                bootLogs.appendChild(p); scriptIdx++;
                setTimeout(runBootSequence, 300);
            } else {
                setTimeout(() => {
                    bootScreen.classList.add('hidden');
                    mainTerminal.classList.remove('scale-95', 'opacity-0');
                    speakAI("Clap Pipe is online.");
                    writeLog("ClapPipe main console active.");
                }, 400);
            }
        }
        window.onload = runBootSequence;

        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        resize(); window.onresize = resize;
        const matrixChars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789$#@%&";
        const fontSize = 14; const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);
        let rainColor = '#22c55e';

        function drawMatrix() {
            ctx.fillStyle = 'rgba(2, 5, 3, 0.05)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = rainColor; ctx.font = fontSize + 'px monospace';
            for (let i = 0; i < drops.length; i++) {
                const text = matrixChars[Math.floor(Math.random() * matrixChars.length)];
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 30);

        const generateBtn = document.getElementById('generate-btn');
        const generatedCodeBox = document.getElementById('generated-code-box');
        const displayCode = document.getElementById('display-code');
        const roomCodeInput = document.getElementById('room-code-input');
        const joinBtn = document.getElementById('join-btn');
        const statusEl = document.getElementById('status');
        const setupSection = document.getElementById('setup-section');
        const syncSection = document.getElementById('sync-section');
        const activeRoomIdEl = document.getElementById('active-room-id');
        const clipboardBox = document.getElementById('clipboard-box');
        const fileInput = document.getElementById('file-input');
        const logBox = document.getElementById('terminal-logs');
        const purgeZone = document.getElementById('purge-zone');
        const purgeBtn = document.getElementById('purge-btn');
        const uploadPlaceholder = document.getElementById('upload-placeholder');

        let peer = null, conn = null, finalRoomCode = "";
        const CHUNK_SIZE = 16384; 
        let isPurged = false;

        function writeLog(msg, isWarning = false) {
            const time = new Date().toTimeString().split(' ')[0];
            const div = document.createElement('div');
            div.className = isWarning ? "text-red-500 animate-pulse font-bold" : "text-green-500/80";
            div.innerText = `[${time}] ${msg}`;
            logBox.appendChild(div); logBox.scrollTop = logBox.scrollHeight;
        }

        function toggleRedAlert(active) {
            const terminalWindow = document.getElementById('main-terminal');
            const alertGlow = document.getElementById('alert-glow');
            const titleBar = document.getElementById('title-bar');
            const banner = document.getElementById('link-banner');
            const pulse = document.getElementById('indicator-pulse');

            if (active) {
                document.documentElement.style.setProperty('--glow-color', 'rgba(239, 68, 68, 0.8)');
                rainColor = '#ef4444';
                terminalWindow.classList.add('border-red-500', 'shadow-[0_0_60px_rgba(239,68,68,0.3)]');
                alertGlow.classList.replace('bg-red-600/0', 'bg-red-600/5');
                titleBar.className = "flex items-center justify-between border-b border-red-500/30 pb-3 mb-6 text-xs text-red-500/60 font-bold tracking-widest";
                banner.className = "bg-red-950/20 border border-red-500/30 p-2.5 rounded text-xs text-red-400 flex items-center justify-between font-mono shadow-inner";
                pulse.className = "w-2.5 h-2.5 rounded-full bg-red-500 shadow-[0_0_8px_#ef4444] animate-ping";
            } else {
                document.documentElement.style.setProperty('--glow-color', 'rgba(34, 197, 94, 0.7)');
                rainColor = '#22c55e';
                terminalWindow.classList.remove('border-red-500', 'shadow-[0_0_60px_rgba(239,68,68,0.3)]');
                alertGlow.classList.replace('bg-red-600/5', 'bg-red-600/0');
                titleBar.className = "flex items-center justify-between border-b border-green-500/30 pb-3 mb-6 text-xs text-green-500/60 font-bold tracking-widest";
                banner.className = "bg-green-950/20 border border-green-500/30 p-2.5 rounded text-xs text-green-400 flex items-center justify-between font-mono shadow-inner";
                pulse.className = "w-2.5 h-2.5 rounded-full bg-green-500 shadow-[0_0_8px_#22c55e] animate-pulse";
            }
        }

        function triggerCrashShake() {
            mainTerminal.classList.add('shake-active');
            setTimeout(() => mainTerminal.classList.remove('shake-active'), 400);
        }

        generateBtn.addEventListener('click', () => {
            generateBtn.disabled = true;
            statusEl.innerText = ">> SPINNING UP CLAPPIPE ROUTE...";
            finalRoomCode = Math.floor(1000 + Math.random() * 9000).toString();
            peer = new Peer('vybe-' + finalRoomCode);

            peer.on('open', () => {
                statusEl.innerText = "";
                generatedCodeBox.classList.remove('hidden');
                displayCode.innerText = finalRoomCode;
                speakAI("Pipe ready. Passcode is " + finalRoomCode.split('').join(' '));
                peer.on('connection', (connection) => { conn = connection; startSharing(); });
            });
            peer.on('error', () => generateBtn.click());
        });

        joinBtn.addEventListener('click', () => {
            finalRoomCode = roomCodeInput.value.trim();
            if (finalRoomCode.length !== 4) {
                triggerCrashShake(); speakAI("Access Denied");
                statusEl.innerText = ">> SECURITY FAULT: PIN BREAK VIOLATION";
                return;
            }
            statusEl.innerText = ">> INTEGRATING WITH THE PIPE...";
            joinBtn.disabled = true;
            peer = new Peer();
            peer.on('open', () => { conn = peer.connect('vybe-' + finalRoomCode); startSharing(); });
            peer.on('error', () => {
                triggerCrashShake(); speakAI("Gateway failure");
                statusEl.innerText = ">> BRIDGE ATTEMPT REJECTED."; joinBtn.disabled = false;
            });
        });

        function startSharing() {
            let receivedChunks = []; let currentIncomingFile = null;
            conn.on('open', () => {
                speakAI("Pipe synced");
                setupSection.classList.add('hidden'); syncSection.classList.remove('hidden');
                activeRoomIdEl.innerText = finalRoomCode;
                writeLog(`ClapPipe tunnel locked on sector [${finalRoomCode}]`);

                conn.on('data', (data) => {
                    if (data.type === 'text') {
                        clipboardBox.value = data.content;
                    } 
                    else if (data.type === 'stream-abort') {
                        toggleRedAlert(false);
                        purgeZone.classList.add('hidden');
                        fileInput.value = "";
                        uploadPlaceholder.innerText = "[ TRANSMIT DATA PAYLOAD OVER CLAPPIPE ]";
                        speakAI("Pipe stream purged");
                        writeLog("❌ WARNING: DATA STREAM PURGED BY SENDER.", true);
                        receivedChunks = [];
                    }
                    else if (data.type === 'file-start') {
                        receivedChunks = []; currentIncomingFile = data;
                        toggleRedAlert(true); purgeZone.classList.remove('hidden');
                        speakAI("Inbound data streaming");
                        writeLog(`[ALERT] INBOUND STREAM: ${data.fileName.toUpperCase()}`, true);
                    } else if (data.type === 'file-chunk') {
                        receivedChunks.push(data.chunk);
                        let progress = Math.round((receivedChunks.length / data.totalChunks) * 100);
                        writeLog(`[CLAPPIPE] Buffering packets: ${progress}%`);
                    } else if (data.type === 'file-end') {
                        toggleRedAlert(false); purgeZone.classList.add('hidden');
                        speakAI("Download ready");
                        writeLog(`Compiling raw packets to disk...`);
                        const blob = new Blob(receivedChunks, { type: currentIncomingFile.fileType });
                        const link = document.createElement('a');
                        link.href = URL.createObjectURL(blob); link.download = currentIncomingFile.fileName;
                        link.innerText = `[💾 INJECTED PAYLOAD: DOWNLOAD FILE]`;
                        link.className = "block bg-green-500 text-black text-center text-xs py-2 rounded mt-2 font-black tracking-widest border border-green-400 hover:bg-green-400 transition-all cursor-pointer shadow-[0_0_15px_rgba(34,197,94,0.3)]";
                        logBox.appendChild(link); logBox.scrollTop = logBox.scrollHeight;
                    }
                });
            });
            conn.on('close', () => { speakAI("Pipe broken"); alert("Link severed!"); window.location.reload(); });
        }

        clipboardBox.addEventListener('input', () => { if (conn && conn.open) conn.send({ type: 'text', content: clipboardBox.value }); });

        purgeBtn.addEventListener('click', () => {
            isPurged = true;
            if (conn && conn.open) conn.send({ type: 'stream-abort' });
            toggleRedAlert(false);
            purgeZone.classList.add('hidden');
            fileInput.value = "";
            uploadPlaceholder.innerText = "[ TRANSMIT DATA PAYLOAD OVER CLAPPIPE ]";
            speakAI("Stream wiped");
            writeLog("💥 SYSTEM FLUSHED: CLAPPIPE DATA PIPELINE PURGED.", true);
        });

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0]; if (!file || !conn || !conn.open) return;
            const totalChunks = Math.ceil(file.size / CHUNK_SIZE);
            
            isPurged = false;
            toggleRedAlert(true); 
            purgeZone.classList.remove('hidden');
            uploadPlaceholder.innerText = `SENDING via CLAPPIPE: ${file.name.toUpperCase()}`;
            speakAI("Beaming data");
            writeLog(`[ALERT] PIPELINE ACTIVE FOR: ${file.name.toUpperCase()}`, true);

            conn.send({ type: 'file-start', fileName: file.name, fileType: file.type });
            let currentChunk = 0; const fileReader = new FileReader();
            
            function loadNext() { 
                if(isPurged) return;
                const start = currentChunk * CHUNK_SIZE; 
                const end = Math.min(start + CHUNK_SIZE, file.size); 
                fileReader.readAsArrayBuffer(file.slice(start, end)); 
            }

            fileReader.onload = function(event) {
                if(isPurged) return; 
                conn.send({ type: 'file-chunk', chunk: event.target.result, totalChunks: totalChunks });
                currentChunk++;
                let progress = Math.round((currentChunk / totalChunks) * 100);
                writeLog(`[BEAMING] Outbound packets: ${progress}%`);
                
                if (currentChunk < totalChunks) {
                    loadNext();
                } else {
                    conn.send({ type: 'file-end' }); 
                    toggleRedAlert(false); 
                    purgeZone.classList.add('hidden');
                    fileInput.value = "";
                    uploadPlaceholder.innerText = "[ TRANSMIT DATA PAYLOAD OVER CLAPPIPE ]";
                    speakAI("Transfer complete"); 
                    writeLog(`✅ ClapPipe beam finished successfully.`); 
                }
            };
            loadNext();
        });
    </script>
</body>
</html>
